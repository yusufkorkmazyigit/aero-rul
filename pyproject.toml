[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "aerorul"
version = "0.1.0.dev0"
description = "Remaining useful life prediction for turbofan engines on NASA N-CMAPSS, with calibrated uncertainty."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Yusuf Korkmazyiğit" }]
requires-python = ">=3.10"
keywords = ["predictive maintenance", "remaining useful life", "N-CMAPSS", "conformal prediction", "aviation"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "numpy>=1.24",
    "pandas>=2.2",
    "pyarrow>=14",
    "h5py>=3.9",
    "pydantic>=2.5",
    "pyyaml>=6.0",
    "typer>=0.12",
    "scikit-learn>=1.4",
    "lightgbm>=4.0",
    "joblib>=1.3",
    "tabulate>=0.9",
    "matplotlib>=3.8",
    "scipy>=1.11",
    "abcopt>=0.2.2",
    "optuna>=3.6",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6"]

[project.scripts]
aerorul = "aerorul.cli:app"

[project.urls]
Homepage = "https://github.com/yusufkorkmazyigit/aero-rul"
Issues = "https://github.com/yusufkorkmazyigit/aero-rul/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/aerorul"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "NPY", "PD", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
